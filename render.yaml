services:
  - type: web
    name: okx-turtle-soup-webhook
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MARGIN_USDT
        value: "50"
      - key: MAX_LEVERAGE_CAP
        value: ""
      - key: OKX_SIMULATED
        value: "0"
